        // 顯示 Toast 提示
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2400);
        }

        function switchTab(tabId) {
            currentTab = tabId;
            updateTabStyles();
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 切換顯示/隱藏車程

            showTransit = !showTransit;

            showToast(showTransit ? "已顯示行車移動段" : "已隱藏行車移動段（僅看景點）");
        }

        // 更新分頁按鈕樣式
        function updateTabStyles() {
            const tabs = ['all', 'day1', 'day2', 'day3', 'summary'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (!btn) return;
                if (t === currentTab) {
                    btn.className = "tab-btn flex-shrink-0 py-2 px-3 rounded-md text-left transition-all border bg-sage text-white border-sage shadow-sm";
                } else {
                    btn.className = "tab-btn flex-shrink-0 py-2 px-3 rounded-md text-left transition-all border bg-stone-card text-ink-muted border-stone-border hover:border-sage-light hover:text-ink-primary";
                }
            });
        }

        function toggleComplete(stopId) {
            completedStops[stopId] = !completedStops[stopId];
            localStorage.setItem('yilan_trip_2026_completed', JSON.stringify(completedStops));
            renderContent();
            if (completedStops[stopId]) {
                showToast("已標記為完成・旅途順利");
            }
        }

            text += `========================\n`;

            keys.forEach(k => {
                const day = ITINERARY_DATA[k];
                text += `\n■ ${day.dayLabel}（${day.date}）\n${day.themeTitle}\n------------------------\n`;
                day.items.forEach(item => {
                    if (item.type === 'stop') {
                        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.mapQuery)}`;
                        text += `● ${item.time}｜${item.title}（${item.duration}）\n`;
                        text += `   ${item.description}\n`;
                        if (item.highlights) {
                            item.highlights.forEach(h => {
                                text += `   - ${h}\n`;

                        }
                        text += `   📍 導航：${mapUrl}\n`;
                    } else {
                        text += `  ↓ ${item.time}｜行車移動（${item.duration}，${item.route}）\n`;

                });

            text += `\n========================\n祝大家旅途平安愉快！`;

            } catch (err) {
                showToast("複製失敗，請手動選取文字");

            document.body.removeChild(textArea);

                                <!-- 時間與分類標籤列 -->
                                <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
                                    <div class="flex items-center gap-2">
                                        <span class="font-mono text-xs sm:text-sm font-semibold text-sage-dark tabular-nums tracking-tight">
                                            ${item.time}
                                        </span>
                                        <span class="text-[11px] px-2 py-0.5 rounded bg-sage-tint text-sage font-medium">
                                            ${item.category}
                                        </span>
                                    </div>
                                    <span class="text-[11px] text-ink-muted border border-stone-border px-2 py-0.5 rounded-full bg-stone-bg">
                                        ${item.duration}
                                    </span>
                                </div>

                                <!-- 景點標題 -->
                                <h3 class="font-serif text-base sm:text-lg font-semibold text-ink-primary leading-snug ${isDone ? 'line-through text-ink-muted' : ''}">
                                    ${item.title}
                                </h3>

                                <!-- 詳細說明 -->
                                <p class="mt-2 text-xs sm:text-sm text-ink-muted leading-relaxed">
                                    ${item.description}
                                </p>

                                <!-- 亮點 / 貼心提醒清單 -->
                                ${item.highlights && item.highlights.length > 0 ? `
                                    <ul class="mt-3 pt-3 border-t border-stone-border/70 space-y-1.5">
                                        ${item.highlights.map(h => `
                                            <li class="flex items-start gap-2 text-xs text-ink-primary/90 leading-relaxed">
                                                <span class="text-sage mt-0.5">•</span>
                                                <span>${h}</span>
                                            </li>
                                        `).join('')}
                                    </ul>
                                ` : ''}

                                <!-- 底部操作按鈕列 -->
                                <div class="mt-4 pt-3 border-t border-stone-border/50 flex flex-wrap items-center justify-between gap-2">
                                    <div class="flex flex-wrap items-center gap-2">
                                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer"
                                           class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-stone-bg hover:bg-sage hover:text-white text-ink-primary border border-stone-border hover:border-sage text-xs font-medium transition-colors">
                                            <svg class="w-3.5 h-3.5 text-sage" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                            </svg>
                                            <span>Google Maps 導航</span>
                                        </a>

                                        ${item.externalLink ? `
                                            <a href="${item.externalLink}" target="_blank" rel="noopener noreferrer"
                                               class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-sage-tint hover:bg-sage hover:text-white text-sage-dark border border-sage-light/40 text-xs font-medium transition-colors">
                                                <span>${item.externalLabel || '開啟連結'}</span>
                                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                                </svg>
                                            </a>
                                        ` : ''}
                                    </div>

                                    <button onclick="toggleComplete('${item.id}')"
                                        class="text-xs px-2.5 py-1 rounded-md transition-colors ${isDone ? 'text-sage font-medium bg-sage-tint' : 'text-ink-light hover:text-ink-primary'}">
                                        ${isDone ? '✓ 已抵達' : '標記完成'}
                                    </button>
                                </div>
                            </article>
                        </div>
                    `;
                }
            });

            html += `</div></section>`;
            return html;
        }

        // 渲染「全程精確路線與滯留時間總表」
        function renderSummaryTableView() {
            const days = ['day1', 'day2', 'day3'];
            
            let html = `
                <div class="fade-in space-y-8">
                    <!-- 標題與複製按鈕 -->
                    <div class="pb-5 border-b border-stone-border flex flex-wrap items-end justify-between gap-4">
                        <div>
                            <span class="font-serif text-xs tracking-[0.2em] text-sage font-semibold uppercase">MASTER SCHEDULE & ROUTE</span>
                            <h2 class="mt-1 font-serif text-xl sm:text-2xl font-semibold text-ink-primary">
                                全程精確路線與滯留時間總表
                            </h2>
                            <p class="mt-1.5 text-xs sm:text-sm text-ink-muted">
                                一覽三日所有景點、行車移動時間、滯留時長，點擊地點名稱即可直接開啟 Google Maps 導航。
                            </p>
                        </div>
                        <button onclick="copyItineraryText('all')" 
                            class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-sage text-white hover:bg-sage-dark text-xs font-medium transition-colors shadow-sm">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                            </svg>
                            <span>複製三日完整行程</span>
                        </button>
                    </div>

                    <!-- 三車會合與 Day 3 返程時間精確總覽 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-stone-card rounded-xl border border-stone-border p-4 sm:p-5 editorial-shadow">
                            <div class="flex items-center gap-2 text-sage font-serif font-semibold text-sm mb-2.5">
                                <span class="w-2 h-2 rounded-full bg-sage"></span>
                                <h3>Day 1 首站集結時刻（外澳遊客中心）</h3>
                            </div>
                            <ul class="space-y-1.5 text-xs text-ink-primary leading-relaxed">
                                <li>• <strong>會合時段</strong>：11/14（週六）08:15–09:15（滯留 1 小時）</li>
                                <li>• <strong>A車 / B車</strong>：車程約 2.2–2.5 小時</li>
                                <li>• <strong>C車</strong>：接人後車程約 50 分鐘抵達</li>
                            </ul>
                        </div>

                        <div class="bg-stone-card rounded-xl border border-stone-border p-4 sm:p-5 editorial-shadow">
                            <div class="flex items-center gap-2 text-sage font-serif font-semibold text-sm mb-2.5">
                                <span class="w-2 h-2 rounded-full bg-sage"></span>
                                <h3>Day 3 返程時間控管（13:45 準時上國五）</h3>
                            </div>
                            <ul class="space-y-1.5 text-xs text-ink-primary leading-relaxed">
                                <li>• <strong>A 車返抵南投</strong>：約 <strong class="text-sage-dark tabular-nums">16:40–16:55</strong>（達成 17:00 前返抵南投）</li>
                                <li>• <strong>B 車返抵台中</strong>：約 <strong class="text-sage-dark tabular-nums">16:15–16:30</strong></li>
                                <li>• <strong>C 車送弟返竹</strong>：新店約 <strong class="text-sage-dark tabular-nums">14:40</strong>，新竹約 <strong class="text-sage-dark tabular-nums">15:45</strong></li>
                            </ul>
                        </div>
                    </div>
            `;

            // 逐日渲染精確總表
            days.forEach(dayKey => {
                const day = ITINERARY_DATA[dayKey];
                const stops = day.items.filter(i => i.type === 'stop');
                
                html += `
                    <div class="bg-stone-card rounded-xl border border-stone-border overflow-hidden editorial-shadow">
                        <!-- 表格日標題與動線流向 -->
                        <div class="bg-stone-subtle/80 px-4 py-3.5 sm:px-6 border-b border-stone-border">
                            <div class="flex flex-wrap items-center justify-between gap-2">
                                <span class="font-serif font-semibold text-sm sm:text-base text-ink-primary">
                                    ${day.dayLabel}（${day.date}）
                                </span>
                                <span class="text-[11px] text-sage font-medium bg-sage-tint px-2.5 py-0.5 rounded-full border border-sage-light/30">
                                    共 ${stops.length} 個停靠點
                                </span>
                            </div>
                            <!-- 動線箭頭流向列 -->
                            <div class="mt-2 flex flex-wrap items-center gap-1.5 text-[11px] text-ink-muted">
                                ${stops.map((s, idx) => `
                                    <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.mapQuery)}" target="_blank" rel="noopener noreferrer"
                                       class="hover:text-sage-dark hover:underline font-medium text-ink-primary">
                                        ${s.title.split('（')[0]}
                                    </a>
                                    ${idx < stops.length - 1 ? '<span class="text-sage">➔</span>' : ''}
                                `).join('')}
                            </div>
                        </div>

                        <!-- 響應式明細表格 -->
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-stone-border bg-stone-bg/60 text-[11px] text-ink-muted font-medium">
                                        <th class="py-2.5 px-3 sm:px-5 whitespace-nowrap">時段</th>
                                        <th class="py-2.5 px-3 sm:px-4">地點 / 路線階段</th>
                                        <th class="py-2.5 px-3 sm:px-4 whitespace-nowrap">行車 / 滯留時間</th>
                                        <th class="py-2.5 px-3 sm:px-5 text-right whitespace-nowrap">導航 / 連結</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-stone-border/70 text-xs">
                                    ${day.items.map(item => {
                                        if (item.type === 'transit') {
                                            return `
                                                <tr class="bg-stone-bg/40 text-ink-muted">
                                                    <td class="py-2 px-3 sm:px-5 font-mono text-[11px] tabular-nums whitespace-nowrap">${item.time}</td>
                                                    <td class="py-2 px-3 sm:px-4">
                                                        <span class="inline-flex items-center gap-1 text-[11px]">
                                                            <span class="text-sage">↓</span> 行車移動：${item.route}
                                                        </span>
                                                    </td>
                                                    <td class="py-2 px-3 sm:px-4 whitespace-nowrap text-[11px]">${item.duration}</td>
                                                    <td class="py-2 px-3 sm:px-5 text-right text-[11px] text-ink-light">—</td>
                                                </tr>
                                            `;
                                        } else {
                                            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.mapQuery)}`;
                                            return `
                                                <tr class="hover:bg-sage-tint/30 transition-colors">
                                                    <td class="py-3 px-3 sm:px-5 font-mono font-semibold text-sage-dark tabular-nums whitespace-nowrap align-top">
                                                        ${item.time}
                                                    </td>
                                                    <td class="py-3 px-3 sm:px-4 align-top">
                                                        <div class="font-serif font-semibold text-ink-primary text-xs sm:text-sm">
                                                            ${item.title}
                                                        </div>
                                                        <div class="mt-0.5 text-[11px] text-ink-muted line-clamp-2">
                                                            ${item.description}
                                                        </div>
                                                    </td>
                                                    <td class="py-3 px-3 sm:px-4 whitespace-nowrap align-top">
                                                        <span class="inline-block px-2 py-0.5 rounded bg-stone-subtle text-ink-primary text-[11px] font-medium">
                                                            ${item.duration}
                                                        </span>
                                                    </td>
                                                    <td class="py-3 px-3 sm:px-5 text-right whitespace-nowrap align-top">
                                                        <div class="inline-flex flex-col sm:flex-row items-end sm:items-center gap-1.5">
                                                            <a href="${mapUrl}" target="_blank" rel="noopener noreferrer"
                                                               class="inline-flex items-center gap-1 px-2.5 py-1 rounded bg-sage-tint hover:bg-sage text-sage-dark hover:text-white text-[11px] font-medium transition-colors">
                                                                <span>📍 地圖</span>
                                                            </a>
                                                            ${item.externalLink ? `
                                                                <a href="${item.externalLink}" target="_blank" rel="noopener noreferrer"
                                                                   class="inline-flex items-center gap-1 px-2.5 py-1 rounded bg-stone-subtle hover:bg-ink-primary text-ink-primary hover:text-white text-[11px] font-medium transition-colors">
                                                                    <span>介紹</span>
                                                                </a>
                                                            ` : ''}
                                                        </div>
                                                    </td>
                                                </tr>
                                            `;
                                        }
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            return html;
        }

        // 渲染主內容
        function renderContent() {
            const container = document.getElementById('main-content');
            
            if (currentTab === 'summary') {
                container.innerHTML = renderSummaryTableView();
                return;
            }

            // 頂部工具列（顯示/隱藏車程 + 複製完整行程）
            let toolbarHtml = `
                <div class="fade-in">
                    <div class="mb-6 p-3 rounded-xl bg-stone-card border border-stone-border flex flex-wrap items-center justify-between gap-2.5 editorial-shadow">
                        <button onclick="toggleTransit()" 
                            class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium border transition-colors
                            ${showTransit ? 'bg-sage-tint text-sage-dark border-sage-light/50' : 'bg-stone-bg text-ink-muted border-stone-border'}">
                            <span class="w-2 h-2 rounded-full ${showTransit ? 'bg-sage' : 'bg-ink-light'}"></span>
                            <span>${showTransit ? '顯示車程移動中' : '已隱藏車程移動'}</span>
                        </button>

                        <div class="flex items-center gap-2">
                            <button onclick="switchTab('summary')" 
                                class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-stone-bg hover:bg-stone-subtle text-ink-primary border border-stone-border text-xs font-medium transition-colors">
                                <span>📊 路線與滯留總表</span>
                            </button>
                            <button onclick="copyItineraryText('all')" 
                                class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-sage text-white hover:bg-sage-dark text-xs font-medium transition-colors">
                                <span>複製三日行程</span>
                            </button>
                        </div>
                    </div>
            `;

            if (currentTab === 'all') {
                toolbarHtml += buildDaySectionHTML('day1', true);
                toolbarHtml += buildDaySectionHTML('day2', true);
                toolbarHtml += buildDaySectionHTML('day3', true);
            } else {
                toolbarHtml += buildDaySectionHTML(currentTab, false);
            }

            toolbarHtml += `</div>`;
            container.innerHTML = toolbarHtml;
        }

        // 初始化頁面
        document.addEventListener('DOMContentLoaded', () => {
            updateTabStyles();
            renderContent();
        });
    </script>
</body>
</html>
