            if (packingExpanded) {
                body.classList.remove('hidden');

        // 顯示 Toast 提示
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 2400);
        }

        // 切換分頁
        function switchTab(tabId) {
            currentTab = tabId;

            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });

        function toggleTransit() {
            showTransit = !showTransit;

        // 更新分頁按鈕樣式
        function updateTabStyles() {
            const tabs = ['all', 'day1', 'day2', 'day3', 'prep', 'summary'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (!btn) return;
                if (t === currentTab) {
                    btn.className = "tab-btn flex-shrink-0 py-2 px-3 rounded-md text-left transition-all border bg-sage text-white border-sage shadow-sm";
                } else {
                    btn.className = "tab-btn flex-shrink-0 py-2 px-3 rounded-md text-left transition-all border bg-stone-card text-ink-muted border-stone-border hover:border-sage-light hover:text-ink-primary";

        function toggleComplete(stopId) {
            completedStops[stopId] = !completedStops[stopId];
            localStorage.setItem('yilan_trip_2026_completed', JSON.stringify(completedStops));
            renderContent();
            if (completedStops[stopId]) {
                showToast("已標記為完成・旅途順利");

        // 複製單日或全部行程文字（供貼上 LINE 群組）
        function copyItineraryText(targetKey) {
            const keys = targetKey === 'all' ? ['day1', 'day2', 'day3'] : [targetKey];
            let text = `【宜蘭山海・三日慢旅】2026.11.14–11.16 行程表\n`;
            text += `🏠 Day 1 宿：甜蜜的家包棟民宿 https://www.airbnb.com.tw/rooms/1754320055345499154?adults=1&s=67&unique_share_id=84502542-d72a-4ff4-a36c-5e30fcf927fa\n`;
            text += `♨️ Day 2 宿：東旅湯宿溫泉飯店-風華漾館 https://www.hoteleastgroup.com/hotels/yunoyado-dy/room.php\n`;
            text += `========================\n`;

            keys.forEach(k => {
                const day = ITINERARY_DATA[k];
                text += `\n■ ${day.dayLabel}（${day.date}）\n${day.themeTitle}\n------------------------\n`;
                day.items.forEach(item => {
                    if (item.type === 'stop') {
                        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.mapQuery)}`;
                        text += `● ${item.time}｜${item.title}（${item.duration}）\n`;
                        text += `   ${item.description}\n`;
                        if (item.highlights) {
                            item.highlights.forEach(h => {
                                text += `   - ${h}\n`;
                            });
                        }
                        text += `   📍 導航：${mapUrl}\n`;
                    } else {
                        text += `  ↓ ${item.time}｜行車移動（${item.duration}，${item.route}）\n`;
                    }
                });
            });

            text += `\n========================\n祝大家旅途平安愉快！`;

            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(targetKey === 'all' ? "已複製三日完整行程，可直接貼上 LINE 群組！" : `已複製 ${ITINERARY_DATA[targetKey].date} 行程！`);
            } catch (err) {
                showToast("複製失敗，請手動選取文字");
            }
            document.body.removeChild(textArea);
        }

                            </button>
                        </div>

                        <div id="packing-list-body" class="mt-4 pt-3.5 border-t border-stone-border/70 grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                            <!-- 由 renderPackingList() 動態渲染 -->
                        </div>
                    </div>
                </div>
            `;
        }

        // 渲染「全程精確路線與滯留時間總表」
        function renderSummaryTableView() {
            const days = ['day1', 'day2', 'day3'];
            
            let html = `
                <div class="fade-in space-y-8">
                    <!-- 標題與複製按鈕 -->
                    <div class="pb-5 border-b border-stone-border flex flex-wrap items-end justify-between gap-4">
                        <div>
                            <span class="font-serif text-xs tracking-[0.2em] text-sage font-semibold uppercase">MASTER SCHEDULE & ROUTE</span>
                            <h2 class="mt-1 font-serif text-xl sm:text-2xl font-semibold text-ink-primary">
                                全程精確路線與滯留時間總表
                            </h2>
                            <p class="mt-1.5 text-xs sm:text-sm text-ink-muted">
                                一覽三日所有景點、行車移動時間、滯留時長，點擊地點名稱即可直接開啟 Google Maps 導航。
                            </p>
                        </div>
                        <button onclick="copyItineraryText('all')" 
                            class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-sage text-white hover:bg-sage-dark text-xs font-medium transition-colors shadow-sm">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                            </svg>
                            <span>複製三日完整行程</span>
                        </button>
                    </div>

                    <!-- 三車會合與 Day 3 返程時間精確總覽 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-stone-card rounded-xl border border-stone-border p-4 sm:p-5 editorial-shadow">
                            <div class="flex items-center justify-between gap-2 mb-2.5">
                                <div class="flex items-center gap-2 text-sage font-serif font-semibold text-sm">
                                    <span class="w-2 h-2 rounded-full bg-sage"></span>
                                    <h3>Day 1 三車發車與會合時刻表</h3>
                                </div>
                                <a href="https://www.google.com/maps/search/?api=1&query=%E5%A4%96%E6%BE%B3%E9%81%8A%E5%AE%A2%E4%B8%AD%E5%BF%83+%E5%AE%9C%E8%98%AD%E9%A0%AD%E5%9F%8E" target="_blank" rel="noopener noreferrer"
                                   class="text-[11px] text-sage hover:underline font-medium">📍 外澳地圖</a>
                            </div>
                            <ul class="space-y-2 text-xs text-ink-primary leading-relaxed">
                                <li>• <strong>A車（南投直達）</strong>：<strong class="text-sage-dark tabular-nums">04:45–05:00</strong> 出發 ➔ 國三接國五（約 2.5 小時）</li>
                                <li>• <strong>B車（新竹直達）</strong>：<strong class="text-sage-dark tabular-nums">05:45–06:00</strong> 出發 ➔ 國三接國五（約 1.5 小時）</li>
                                <li>• <strong>C車（新竹經新北載人）</strong>：<strong class="text-sage-dark tabular-nums">05:35</strong> 出發 ➔ <strong class="text-sage-dark tabular-nums">06:30</strong> 新店捷運站接弟弟 ➔ 接國五（全程約 2 小時）</li>
                                <li class="pt-1.5 mt-1.5 border-t border-stone-border/70 text-sage-dark font-medium">
                                    📍 <strong>全員會合</strong>：<span class="tabular-nums">07:45–08:15</span> 外澳遊客中心（看衝浪、吃早餐）
                                </li>
                            </ul>
                        </div>

                        <div class="bg-stone-card rounded-xl border border-stone-border p-4 sm:p-5 editorial-shadow">
                            <div class="flex items-center gap-2 text-sage font-serif font-semibold text-sm mb-2.5">
                                <span class="w-2 h-2 rounded-full bg-sage"></span>
                                <h3>Day 3 返程時間控管（13:45 準時上國五）</h3>
                            </div>
                            <ul class="space-y-2 text-xs text-ink-primary leading-relaxed">
                                <li>• <strong>A 車返抵南投</strong>：約 <strong class="text-sage-dark tabular-nums">16:40–16:55</strong>（達成 17:00 前返抵南投）</li>
                                <li>• <strong>B 車返抵台中</strong>：約 <strong class="text-sage-dark tabular-nums">16:15–16:30</strong></li>
                                <li>• <strong>C 車送弟返竹</strong>：新店約 <strong class="text-sage-dark tabular-nums">14:40</strong>，新竹約 <strong class="text-sage-dark tabular-nums">15:45</strong></li>
                            </ul>
                        </div>
                    </div>
            `;

            // 逐日渲染精確總表
            days.forEach(dayKey => {
                const dayData = ITINERARY_DATA[dayKey];
                html += `
                    <div class="bg-stone-card rounded-xl border border-stone-border overflow-hidden editorial-shadow">
                        <div class="px-4 py-3.5 sm:px-5 bg-sage-tint/60 border-b border-stone-border flex flex-wrap items-center justify-between gap-2">
                            <div>
                                <span class="text-xs font-serif font-semibold text-sage tracking-wider">${dayData.dayLabel}｜${dayData.date}</span>
                                <h3 class="font-serif text-sm sm:text-base font-semibold text-ink-primary mt-0.5">${dayData.themeTitle}</h3>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead>
                                    <tr class="border-b border-stone-border bg-stone-bg/80 text-ink-muted">
                                        <th class="py-2.5 px-3 sm:px-4 font-medium whitespace-nowrap">時段</th>
                                        <th class="py-2.5 px-3 sm:px-4 font-medium">地點 / 移動路線</th>
                                        <th class="py-2.5 px-3 sm:px-4 font-medium whitespace-nowrap">滯留 / 車程</th>
                                        <th class="py-2.5 px-3 sm:px-4 font-medium text-right whitespace-nowrap">導航</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-stone-border/60">
                                    ${dayData.items.map(item => {
                                        if (item.type === 'transit') {
                                            return `
                                                <tr class="bg-stone-subtle/40 text-ink-muted">
                                                    <td class="py-2 px-3 sm:px-4 font-mono tabular-nums whitespace-nowrap text-[11px]">${item.time}</td>
                                                    <td class="py-2 px-3 sm:px-4">🚗 行車移動（${item.route}）</td>
                                                    <td class="py-2 px-3 sm:px-4 whitespace-nowrap text-[11px]">${item.duration}</td>
                                                    <td class="py-2 px-3 sm:px-4 text-right text-[11px] text-ink-light">—</td>
                                                </tr>
                                            `;
                                        }
                                        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.mapQuery)}`;
                                        return `
                                            <tr class="hover:bg-sage-tint/25 transition-colors">
                                                <td class="py-2.5 px-3 sm:px-4 font-mono font-medium text-sage-dark tabular-nums whitespace-nowrap">${item.time}</td>
                                                <td class="py-2.5 px-3 sm:px-4 font-medium text-ink-primary">
                                                    <span class="inline-block text-[10px] px-1.5 py-0.2 rounded bg-sage-tint text-sage mr-1.5">${item.category}</span>
                                                    ${item.title}
                                                </td>
                                                <td class="py-2.5 px-3 sm:px-4 whitespace-nowrap text-ink-muted">${item.duration}</td>
                                                <td class="py-2.5 px-3 sm:px-4 text-right whitespace-nowrap">
                                                    <a href="${mapUrl}" target="_blank" rel="noopener noreferrer"
                                                       class="inline-flex items-center gap-1 px-2.5 py-1 rounded bg-sage-tint hover:bg-sage text-sage-dark hover:text-white font-medium transition-colors">
                                                        <span>📍 地圖</span>
                                                    </a>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            return html;
        }

        // 渲染主內容
        function renderContent() {
            const container = document.getElementById('main-content');
            
            if (currentTab === 'prep') {
                container.innerHTML = renderWeatherAndPrepView();
                renderPackingList();
                return;
            }

            if (currentTab === 'summary') {
                container.innerHTML = renderSummaryTableView();
                return;
            }

            let toolbarHtml = `<div class="fade-in">`;

            if (currentTab === 'all') {
                toolbarHtml += buildDaySectionHTML('day1', true);
                toolbarHtml += buildDaySectionHTML('day2', true);
                toolbarHtml += buildDaySectionHTML('day3', true);
            } else {
                toolbarHtml += buildDaySectionHTML(currentTab, false);
            }

            toolbarHtml += `</div>`;
            container.innerHTML = toolbarHtml;
        }

        // 初始化頁面
        document.addEventListener('DOMContentLoaded', () => {
            updateTabStyles();
            renderContent();
        });
    </script>
</body>
</html>
